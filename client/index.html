<html lang="ar" dir="rtl" data-gender="male" data-mode="dark">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>GITA - الأرشيف الأكاديمي</title>
    <meta name="description" content="المنصة الرسمية لطلاب كلية تقنية المعلومات لتبادل الملفات الأكاديمية." />
    <meta name="theme-color" content="#1e40af" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.googletagmanager.com https://accounts.google.com; script-src-elem 'self' 'unsafe-inline' https://apis.google.com https://www.googletagmanager.com https://accounts.google.com; script-src-attr 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; connect-src 'self' http: https: ws: wss:; frame-src 'self' data: blob: http: https: https://accounts.google.com;">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..900&family=Outfit:wght@300..900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var gender = localStorage.getItem('gita-gender') || 'male';
          var mode = localStorage.getItem('gita-mode') || 'dark';
          document.documentElement.setAttribute('data-gender', gender);
          document.documentElement.setAttribute('data-mode', mode);
        } catch (e) {}
      })();
    </script>
